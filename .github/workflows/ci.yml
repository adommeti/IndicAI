name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  LIVE_API_TESTS: '0'
  LANGFUSE_TRACING_ENABLED: 'false'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  attribution:
    name: commit attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: verify authorship and message hygiene
        env:
          INDICAI_ALLOWED_EMAILS: ${{ vars.ALLOWED_AUTHOR_EMAILS || 'anantha.dommeti@users.noreply.github.com,asdommeti@gmail.com' }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash scripts/attribution-check.sh "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            bash scripts/attribution-check.sh "${{ github.event.before }}..${{ github.sha }}"
          fi
      - name: pull request body hygiene
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # The session proxy appends a single "Generated by Claude Code" footer to every PR body
          # written from a Claude Code session — on REST POST and PATCH alike, after any client-side
          # check — so a PR opened by scripts/ship.sh can never arrive without it. That one line is
          # tolerated; everything else (session links, emoji, vendor addresses, "Generated with")
          # is still rejected here, and commit messages stay strictly clean via attribution-check.sh.
          STRIPPED="$(printf '%s\n' "$PR_BODY" \
            | grep -vE '^_Generated by \[Claude Code\]\(https://claude\.ai/code[^)]*\)_$')"
          if printf '%s\n' "$STRIPPED" | grep -Eiq 'Claude-Session|Generated with \[?Claude|🤖|claude\.ai/(code|share)|noreply@anthropic\.com'; then
            echo "PR body contains a tool-attribution line"; exit 1; fi
          echo "PR body clean"

  checks:
    name: lint · typecheck · unit · offline evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'
      - run: uv sync --frozen --all-packages
      - run: make lint typecheck test
      - run: uv run python -m indic_platform.eval.runners.run --app uc1
      - run: make eval-uc2 eval-uc3
      # The B6 regression gate (uc1/P7 acceptance: "CI runs eval-uc1 and fails on
      # regression thresholds from Part B6"). The thresholds are data in
      # platform/eval/thresholds.yaml, so ratcheting one is a reviewable diff rather
      # than a code change, and --strict turns a breach into a non-zero exit instead
      # of a printed warning. --chat-only keeps live STT (and its spend) out of CI.
      # What this gates is the adversarial threshold (build-blocking at 0%), not agent
      # quality: the target runs --mocked-decisions, because the real graph stage needs
      # TEI, Qdrant, an ingested KB and an Anthropic key that this job does not have.
      # Action accuracy, reply-language match and hit@3 are reported UNMEASURED there
      # rather than scored against a stand-in. See docs/build/BLOCKERS.md.
      - name: eval-uc1-regression
        run: make eval-uc1-regression
      # uc3/P7 acceptance: "CI runs eval-uc3 on every change to prompts/, lexicon/,
      # or policy.md and blocks on regression". Unconditional rather than path-
      # filtered: the gate costs ~7s, and a filter is a list of paths that a moved
      # or renamed file silently falls off. Running it always is the superset --
      # every change to those paths is covered, and so is every change that reaches
      # Stage 0 by another route (the matcher, the golden set, the runner itself).
      - name: eval-uc3-regression
        run: make eval-uc3-regression
      # The path filter that IS load-bearing: it does not decide whether to run the
      # gate, it says what the gate could not test. apps/comms_surveillance/prompts/
      # drives Claude, and there is no key here, so a change to triage.md or
      # deep_analysis.md passes the Stage 0 gate without that gate having exercised
      # one line of it. policy.md's own text promises "CI runs the UC3 eval on every
      # change to this file and blocks on regression" -- true for the lexicon half,
      # and this step is where the other half stops being invisible.
      - name: uc3 policy surface
        if: github.event_name == 'pull_request'
        run: |
          BASE='${{ github.event.pull_request.base.sha }}'
          git fetch --depth=1 origin "$BASE" 2>/dev/null || git fetch --unshallow origin 2>/dev/null || true
          # `|| true` on the diff itself would make "the base sha is missing" and
          # "nothing changed" the same outcome, and the second is the common one.
          # Distinguish them: only a FAILED diff skips the check.
          if ! CHANGED="$(git diff --name-only "$BASE"...HEAD 2>/dev/null)"; then
            echo "could not compute the diff against $BASE; skipping"; exit 0
          fi
          SURFACE="$(printf '%s\n' "$CHANGED" | grep -E '^apps/comms_surveillance/(prompts/|lexicon/|policy\.md)' || true)"
          [ -n "$SURFACE" ] && echo "uc3 policy surface changed:" && printf '  %s\n' $SURFACE
          MODELLED="$(printf '%s\n' "$CHANGED" | grep -E '^apps/comms_surveillance/prompts/' || true)"
          if [ -n "$MODELLED" ]; then
            for f in $MODELLED; do
              echo "::warning file=$f::This prompt drives Claude (Stage 1/2). The offline gate covers Stage 0 only, so this change is UNMEASURED until someone runs 'LIVE_API_TESTS=1 make eval-uc3-full' with an Anthropic key and attaches the numbers."
            done
          fi
          echo "uc3 policy surface check complete"
      - name: ui packages (when present)
        run: |
          for pkg in apps/*/ui; do
            [ -f "$pkg/package.json" ] || continue
            echo "== $pkg"; (cd "$pkg" && npm ci --no-audit --no-fund && npm run lint --if-present && npm run typecheck --if-present && npm run build --if-present && npm test --if-present -- --run)
          done
      # A hook config nobody runs is not a control, and nobody runs this one: the repo
      # pins core.hooksPath to .githooks (commit-msg, pre-push), and pre-commit refuses
      # to install alongside that setting -- `pre-commit install` in scripts/dev-setup.sh
      # fails and is swallowed by `|| true`. So no contributor's commit has ever executed
      # these hooks, and CI is the only place they are enforced. Running every hook here
      # re-runs ruff over a tree `make lint` already covered; that is ~2s and is the price
      # of the config actually being exercised, so the ruff hooks cannot rot unnoticed.
      # Hook environments are rebuilt from scratch otherwise: ~60s per run for two
      # cloned repos, against ~5s warm. Keyed on the config, so changing a rev or
      # adding a hook builds fresh rather than reusing a stale environment.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure
      # Ignored findings are justified one by one in docs/security/audit-exceptions.md,
      # each with the reachability argument that makes it an exception rather than a
      # silencing. Adding an id here without an entry there is not allowed. This runs the
      # audit a second time (the pre-commit step ran the same hook) because only this
      # invocation emits the SBOM artifact below; ~8s, and dropping either one would cost
      # either the SBOM or hook parity.
      - run: >
          uv run pip-audit --skip-editable --ignore-vuln PYSEC-2026-3740
          --format cyclonedx-json --output sbom.json
      # Kept alongside the detect-secrets pre-commit hook rather than folded into it: the
      # hook carries `exclude: uv.lock`, and this step scans every tracked file including
      # uv.lock. It is the wider scan, not a duplicate of the hook.
      - name: secret scan against baseline
        run: uv run detect-secrets-hook --baseline .secrets.baseline $(git ls-files)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals-and-sbom
          path: |
            docs/eval/
            sbom.json

  images:
    name: images (compose config · three app builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `docker compose config` resolves every interpolation and every anchor without a
      # daemon. It is the one half of this job an agent session can run locally, and
      # `make compose-config` is the same command.
      - name: compose config
        run: |
          python3 infra/bootstrap.py
          docker compose --env-file .env.stack config --quiet
          echo "compose config ok"
      - uses: docker/setup-buildx-action@v3
      # The other half, which needs a daemon and so is proven only here. Built through
      # buildx with a GitHub Actions cache: a cold build resolves the whole uv workspace
      # and an npm tree per app, which is minutes, and the cache makes a docs-only PR
      # cheap. load:false because nothing downstream runs the image -- this job asks
      # whether it BUILDS, and `make up` is what runs it.
      - name: build ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.app
          build-args: |
            APP=${{ matrix.app }}
            GIT_SHA=${{ github.sha }}
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
    strategy:
      fail-fast: false
      matrix:
        app: [helpdesk_agent, training_localizer, comms_surveillance]

  integration:
    name: integration (postgres · redis · qdrant)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: platform
          POSTGRES_DB: platform
          POSTGRES_PASSWORD: ci  # pragma: allowlist secret
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U platform -d platform" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.15.5
        ports: ['6333:6333', '6334:6334']
      # No MinIO service container: the official image needs "server /data" as its
      # command and GitHub service containers cannot pass one. The first integration
      # test that needs object storage should start it in a step with `docker run`,
      # pinning the tag docker-compose.yml already uses.
    env:
      DATABASE_URL: postgresql+psycopg://platform:ci@localhost:5433/platform  # pragma: allowlist secret
      REDIS_URL: redis://localhost:6380/0
      QDRANT_URL: http://localhost:6333
      TEI_URL: http://localhost:8080
      SPARSE_URL: http://localhost:8081
      STACK_PASSWORD: ci  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'
      - run: uv sync --frozen --all-packages
      - name: wait for qdrant
        run: for i in $(seq 1 30); do curl -fsS localhost:6333/healthz && break; sleep 2; done
      - name: migrations round-trip
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: integration tests
        run: |
          # --capture=tee-sys keeps each test's printed verification output in the log:
          # the prompts cite that output as the evidence for their acceptance criteria.
          uv run pytest -m integration -q -p no:cacheprovider --capture=tee-sys \
            --junit-xml=integration-results.xml
      - name: assert the integration tests actually ran
        # This job is the only place several acceptance criteria are ever measured, and the
        # tests skip themselves when a service is unreachable -- so a zero exit status does
        # not on its own mean anything was measured. An empty collection and a clean sweep
        # of skips both have to be loud failures, or the evidence can vanish while CI stays
        # green. Count what passed; treat a skip as a broken service, not as a pass.
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("integration-results.xml").getroot()
          passed, skipped = 0, []
          for case in root.iter("testcase"):
              outcomes = {child.tag for child in case}
              if outcomes & {"failure", "error"}:
                  continue
              if "skipped" in outcomes:
                  skipped.append(case.get("classname", "") + "::" + (case.get("name") or ""))
              else:
                  passed += 1
          print(f"integration tests: {passed} passed, {len(skipped)} skipped")
          for name in skipped:
              print(f"  skipped: {name}")
          if passed == 0:
              sys.exit(
                  "FAIL: no integration test passed. Either nothing was collected or every "
                  "test skipped itself -- in both cases this job measured nothing."
              )
          if skipped:
              sys.exit(
                  "FAIL: integration tests skipped in a job that provisions their services. "
                  "A skip here means a service was unreachable, not that the test is optional."
              )
          PY
