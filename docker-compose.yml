name: indic-ai-platform
x-health: &health
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 30s
x-langfuse-env: &langfuse-env
  HOSTNAME: 0.0.0.0
  DATABASE_URL: postgresql://langfuse:${STACK_PASSWORD:?Run make bootstrap}@langfuse-postgres:5432/langfuse
  NEXTAUTH_URL: http://localhost:3002
  NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
  SALT: ${SALT}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  TELEMETRY_ENABLED: 'false'
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${STACK_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: 'false'
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_AUTH: ''
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${STACK_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: 'true'
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${STACK_PASSWORD}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: 'true'
x-langfuse-depends: &langfuse-depends
  langfuse-postgres: {condition: service_healthy}
  clickhouse: {condition: service_healthy}
  redis: {condition: service_healthy}
  minio: {condition: service_healthy}
# Zammad, the uc1 ticketing backend. Compose profile `ticketing` (make
# stack-ticketing) so `make stack-core` and `make up` are unaffected: Zammad is
# Rails plus its own Postgres, Redis and memcached. Transcribed from the upstream
# zammad/zammad-docker-compose service set (tag 7.1.3-0014) with the
# zammad-elasticsearch service dropped and ELASTICSEARCH_ENABLED=false, which is
# the documented way to run without it. Upstream's long list of pass-through
# environment variables is not reproduced; only what this build sets is here.
x-zammad-env: &zammad-env
  MEMCACHE_SERVERS: zammad-memcached:11211
  POSTGRESQL_HOST: zammad-postgresql
  POSTGRESQL_PORT: '5432'
  POSTGRESQL_DB: zammad_production
  POSTGRESQL_USER: zammad
  POSTGRESQL_PASS: ${STACK_PASSWORD:?Run make bootstrap}
  POSTGRESQL_OPTIONS: '?pool=50'
  # zammad-postgresql creates the database from its initdb hook below, and the
  # role Zammad connects with deliberately has no CREATEDB.
  POSTGRESQL_DB_CREATE: 'false'
  REDIS_URL: redis://zammad-redis:6379
  # Upstream documents ELASTICSEARCH_ENABLED=false -- not
  # ZAMMAD_ELASTICSEARCH_ENABLED -- as the switch for running without
  # Elasticsearch, to be set together with dropping the service. Untested here.
  ELASTICSEARCH_ENABLED: 'false'
  NGINX_PORT: '8080'
  TZ: Asia/Kolkata
x-zammad-service: &zammad-service
  profiles: ['ticketing']
  image: ghcr.io/zammad/zammad:7.1.3-0014
  init: true
  environment: *zammad-env
  volumes:
    - 'zammad-backup:/var/tmp/zammad:ro'
    - 'zammad-storage:/opt/zammad/storage'
  depends_on:
    zammad-memcached: {condition: service_healthy}
    zammad-postgresql: {condition: service_healthy}
    zammad-redis: {condition: service_healthy}
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: platform
      POSTGRES_DB: platform
      POSTGRES_PASSWORD: ${STACK_PASSWORD}
    ports: ['127.0.0.1:15433:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      <<: *health
      test: ['CMD-SHELL', 'pg_isready -U platform -d platform']
  qdrant:
    build:
      context: .
      dockerfile: infra/docker/probe.Dockerfile
      args: {SERVICE_IMAGE: 'qdrant/qdrant:v1.15.5'}
    ports: ['127.0.0.1:6333:6333', '127.0.0.1:6334:6334']
    volumes: ['qdrant-data:/qdrant/storage']
    healthcheck:
      <<: *health
      test: ['CMD', 'healthcheck', 'http://localhost:6333/healthz']
  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['127.0.0.1:6380:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      <<: *health
      test: ['CMD', 'redis-cli', 'ping']
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    entrypoint: /bin/sh
    command: -c 'mkdir -p /data/langfuse && minio server /data --console-address :9001'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${STACK_PASSWORD}
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: ['minio-data:/data']
    healthcheck:
      <<: *health
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
  livekit:
    build:
      context: .
      dockerfile: infra/docker/probe.Dockerfile
      args: {SERVICE_IMAGE: 'livekit/livekit-server:v1.9.0'}
    command: ['--config', '/etc/livekit.yaml', '--bind', '0.0.0.0']
    environment:
      LIVEKIT_KEYS: 'devkey: ${STACK_PASSWORD}'
    volumes: ['./infra/livekit.yaml:/etc/livekit.yaml:ro']
    depends_on:
      redis: {condition: service_healthy}
    ports:
      - '127.0.0.1:7880:7880'
      - '127.0.0.1:7881:7881'
      - '127.0.0.1:50100-50120:50100-50120/udp'
    healthcheck:
      <<: *health
      test: ['CMD', 'healthcheck', 'http://localhost:7880/']
  livekit-sip:
    build:
      context: .
      dockerfile: infra/docker/probe.Dockerfile
      args: {SERVICE_IMAGE: 'livekit/sip:latest'}
    command: ['--config', '/etc/sip.yaml']
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey  # pragma: allowlist secret - public local key identifier
      LIVEKIT_API_SECRET: ${STACK_PASSWORD}
    volumes: ['./infra/sip.yaml:/etc/sip.yaml:ro']
    depends_on:
      livekit: {condition: service_healthy}
    ports:
      - '127.0.0.1:5060:5060/tcp'
      - '127.0.0.1:5060:5060/udp'
      - '127.0.0.1:50200-50220:50200-50220/udp'
    healthcheck:
      <<: *health
      test: ['CMD', 'healthcheck', 'http://localhost:8080/']
  tei:
    platform: linux/amd64
    build:
      context: .
      dockerfile: infra/docker/probe.Dockerfile
      args: {SERVICE_IMAGE: 'ghcr.io/huggingface/text-embeddings-inference:cpu-1.8'}
    command: ['--model-id', 'BAAI/bge-m3', '--revision', '5617a9f61b028005a4858fdac845db406aefb181', '--port', '80', '--auto-truncate', '--max-batch-tokens', '512', '--max-concurrent-requests', '2', '--tokenization-workers', '2']
    ports: ['127.0.0.1:8080:80']
    volumes: ['tei-data:/data']
    healthcheck:
      <<: *health
      start_period: 15m
      test: ['CMD', 'healthcheck', 'http://localhost:80/health']
  bge-sparse:
    profiles: ['retrieval']
    build:
      context: .
      dockerfile: infra/sparse/Dockerfile
    ports: ['127.0.0.1:8081:80']
    volumes: ['tei-data:/data']
    healthcheck:
      <<: *health
      start_period: 15m
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost/health")']
  langfuse-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_DB: langfuse
      POSTGRES_PASSWORD: ${STACK_PASSWORD}
    volumes: ['langfuse-postgres-data:/var/lib/postgresql/data']
    healthcheck:
      <<: *health
      test: ['CMD-SHELL', 'pg_isready -U langfuse -d langfuse']
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${STACK_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    volumes: ['clickhouse-data:/var/lib/clickhouse']
    healthcheck:
      <<: *health
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8123/ping']
  langfuse:
    image: langfuse/langfuse:3
    environment:
      <<: *langfuse-env
      LANGFUSE_INIT_ORG_ID: indic
      LANGFUSE_INIT_ORG_NAME: Indic Platform
      LANGFUSE_INIT_PROJECT_ID: indic-platform
      LANGFUSE_INIT_PROJECT_NAME: Indic Platform
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: admin@localhost.test
      LANGFUSE_INIT_USER_NAME: Local Admin
      LANGFUSE_INIT_USER_PASSWORD: ${STACK_PASSWORD}
    ports: ['127.0.0.1:3002:3000']
    depends_on: *langfuse-depends
    healthcheck:
      <<: *health
      start_period: 120s
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/public/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  langfuse-worker:
    image: langfuse/langfuse-worker:3
    environment: *langfuse-env
    depends_on: *langfuse-depends
    healthcheck:
      <<: *health
      start_period: 120s
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3030/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ['127.0.0.1:9090:9090']
    volumes: ['./infra/prometheus.yaml:/etc/prometheus/prometheus.yml:ro', 'prometheus-data:/prometheus']
    healthcheck:
      <<: *health
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9090/-/healthy']
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${STACK_PASSWORD}
      # Read by infra/grafana/provisioning/datasources/platform.yaml, which expands
      # STACK_PASSWORD from Grafana's own environment so the Postgres password is
      # never written into the repo.
      STACK_PASSWORD: ${STACK_PASSWORD}
    ports: ['127.0.0.1:3001:3000']
    # Until uc1/P6 only the data volume was mounted, so the dashboards under
    # infra/grafana/dashboards were never loaded by anything. The two provisioning
    # directories below are what actually loads them. They are mounted as individual
    # subdirectories rather than as the whole /etc/grafana/provisioning tree so the
    # image's own alerting/ and plugins/ provisioning directories survive.
    volumes:
      - 'grafana-data:/var/lib/grafana'
      - './infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro'
      - './infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro'
      - './infra/grafana/dashboards:/etc/grafana/dashboards:ro'
    healthcheck:
      <<: *health
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
  # --- ticketing profile: Zammad (uc1). Started only by `make stack-ticketing`. ---
  zammad-postgresql:
    profiles: ['ticketing']
    image: postgres:17.11-alpine
    environment:
      # The image's bootstrap role is always a superuser, so Zammad gets its own
      # unprivileged role from the initdb hook below instead of reusing it.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${STACK_PASSWORD}
      # Same value the entrypoint would default to; named so the initdb hook
      # below does not depend on that defaulting.
      POSTGRES_DB: postgres
      ZAMMAD_DB: zammad_production
      ZAMMAD_DB_USER: zammad
      ZAMMAD_DB_PASS: ${STACK_PASSWORD}
    volumes: ['zammad-postgresql-data:/var/lib/postgresql/data']
    configs:
      - source: zammad-postgresql-initdb
        target: /docker-entrypoint-initdb.d/10-create-zammad-role.sh
        mode: 0555
    healthcheck:
      # Upstream connects over TCP as Zammad's own role rather than using
      # pg_isready, which reports success for a role or database that does not
      # exist yet, and for the socket-only server that runs during initdb.
      test:
        - CMD-SHELL
        - |-
          PGPASSWORD="$${ZAMMAD_DB_PASS}" \
          psql --no-password --quiet --output /dev/null --variable ON_ERROR_STOP=1 \
               --host 127.0.0.1 --username "$${ZAMMAD_DB_USER}" \
               --dbname "$${ZAMMAD_DB}" --command "SELECT 1"
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5
  zammad-redis:
    profiles: ['ticketing']
    image: redis:8.10.1-alpine
    volumes: ['zammad-redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
  zammad-memcached:
    profiles: ['ticketing']
    image: memcached:1.6.45-alpine
    command: memcached -m 256M
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '11211']
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
  zammad-init:
    <<: *zammad-service
    command: ['zammad-init']
    restart: on-failure
    user: 0:0
  zammad-railsserver:
    <<: *zammad-service
    command: ['zammad-railsserver']
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://127.0.0.1:3000']
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
  zammad-nginx:
    <<: *zammad-service
    command: ['zammad-nginx']
    init: false
    # 8080 and 8081 are already taken by tei and bge-sparse.
    ports: ['127.0.0.1:8082:8080']
    depends_on:
      zammad-railsserver: {condition: service_healthy}
  zammad-scheduler:
    <<: *zammad-service
    command: ['zammad-scheduler']
  zammad-websocket:
    <<: *zammad-service
    command: ['zammad-websocket']
configs:
  # Copied from upstream zammad/zammad-docker-compose. Runs once, while an empty
  # zammad-postgresql-data volume is initialised, to create the database Zammad
  # owns and the plain login role it connects with. '$$' escapes Compose
  # interpolation so the variables expand inside the container.
  zammad-postgresql-initdb:
    content: |
      #!/bin/bash

      set -o errexit
      set -o pipefail

      zammad_abort() {
        echo "$1" >&2
        echo "Correct this, then remove the zammad-postgresql-data volume and start again." >&2
        exit 1
      }

      if [ "$${ZAMMAD_DB_USER}" = "$${POSTGRES_USER}" ]; then
        zammad_abort "POSTGRES_USER and ZAMMAD_DB_USER must differ, the former is a superuser."
      fi

      case "$${ZAMMAD_DB}" in
        postgres | template0 | template1)
          zammad_abort "ZAMMAD_DB must not be one of PostgreSQL's system databases."
          ;;
      esac

      echo "Creating the '$${ZAMMAD_DB_USER}' role and the '$${ZAMMAD_DB}' database..."

      psql --variable ON_ERROR_STOP=1 \
           --username "$${POSTGRES_USER}" \
           --dbname "$${POSTGRES_DB}" \
           --variable role="$${ZAMMAD_DB_USER}" \
           --variable pass="$${ZAMMAD_DB_PASS}" \
           --variable db="$${ZAMMAD_DB}" <<'EOSQL'
      CREATE ROLE :"role" LOGIN PASSWORD :'pass';
      CREATE DATABASE :"db" OWNER :"role";
      EOSQL

volumes:
  postgres-data:
  qdrant-data:
  redis-data:
  minio-data:
  tei-data:
  langfuse-postgres-data:
  clickhouse-data:
  prometheus-data:
  grafana-data:
  zammad-postgresql-data:
  zammad-redis-data:
  zammad-storage:
  zammad-backup:
