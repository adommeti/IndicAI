# Alert rules. infra/grafana/ shipped two dashboards and zero rules, so nothing in this
# programme could page anybody: a dashboard is something you look at after you already
# know, and PRD E8 asks for an alert on a chain break, not a panel showing one.
groups:
  - name: audit
    rules:
      # E8: "a nightly job re-walks the chains and alerts on any break." A break means
      # either a bug in the append path or somebody with more privilege than the app
      # editing the audit trail of a regulated recordkeeping system. Both need a person
      # tonight, which is why this is the one `critical` rule here.
      - alert: AuditChainBroken
        expr: uc3_audit_chain_breaks > 0
        for: 0m
        labels: {severity: critical, app: uc3}
        annotations:
          summary: 'UC3 audit chain verification found {{ $value }} broken chain(s)'
          description: >-
            Run comms_surveillance.audit.verify_chain(session, <table>) for the breaking
            seq and row id; identifiers are deliberately withheld from logs and metrics.
      # The failure the rule above cannot see. A gauge stuck at 0 because the beat died
      # is indistinguishable from a clean chain, and looks healthier than a real break.
      # Nightly at 05:00 UTC, so 26h is one missed run plus room for a slow night.
      - alert: AuditChainVerificationStale
        # The `> 0` guard is load-bearing. A freshly started worker has the gauge at 0, so
        # `time() - 0` is ~1.8e9 and this fired critical 30 minutes after every restart,
        # claiming the nightly job had not completed when the worker had merely booted.
        expr: >-
          uc3_audit_chain_last_verified_timestamp_seconds > 0
          and time() - uc3_audit_chain_last_verified_timestamp_seconds > 93600
        for: 30m
        labels: {severity: critical, app: uc3}
        annotations:
          summary: 'UC3 audit chain has not been verified for over 26h'
          description: >-
            The nightly uc3.chain_verify has not completed. Check the uc3-beat and
            uc3-worker services. An unverified chain is not a verified one.
      # Never scraped at all -- no beat has ever run, or the worker is not exposing its
      # metrics port. Distinct from stale because the remedy is different.
      - alert: AuditChainNeverVerified
        # `== 0`, not `absent()`. The gauge is created at import, so the series exists as
        # soon as anything scrapes a worker and `absent()` could never be true -- the rule
        # meant for "no verification has ever run" was the one rule guaranteed never to
        # fire. 0 is the value a gauge that has never been set actually has.
        expr: uc3_audit_chain_last_verified_timestamp_seconds == 0
        for: 1h
        labels: {severity: warning, app: uc3}
        annotations:
          summary: 'No UC3 chain verification has ever been recorded'

  - name: spend
    rules:
      # T9, denial of wallet. The ledger alerts once per threshold per month; this
      # surfaces the crossing to whatever Prometheus routes to.
      - alert: MonthlyBudgetThresholdCrossed
        expr: increase(adapter_budget_alerts_total[1h]) > 0
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: 'Monthly vendor budget crossed the {{ $labels.threshold }}% threshold'
      # A refusal is the cap working. A *sustained* stream of them means real work is
      # being turned away and somebody should decide whether the cap is wrong or the
      # caller is, so this is deliberately slow to fire.
      - alert: SpendRefusalsSustained
        expr: sum by (vendor, capability, scope) (rate(adapter_budget_refusals_total[15m])) > 0
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.vendor }}/{{ $labels.capability }} refused on the {{ $labels.scope }} cap for 30m'
      - alert: TasksStoppedBySpendCap
        expr: increase(task_budget_stops_total[30m]) > 0
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.task }} stopped by the {{ $labels.scope }} spend cap'
          description: >-
            The task did not fail; it was refused before the vendor was called and its
            chain stopped. Downstream stages did not run.
      # The ledger fell back to in-process counting, so caps hold per worker rather than
      # per deployment. Weaker than intended and deliberately fail-open, but it must not
      # be silent: three workers degraded is three times the intended cap.
      - alert: SpendLedgerDegraded
        expr: increase(adapter_budget_degraded_total[15m]) > 0
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: 'Spend ledger fell back to in-process accounting'

  - name: adapters
    rules:
      - alert: VendorErrorRateHigh
        expr: >-
          sum by (vendor, capability) (rate(adapter_calls_total{status!="ok"}[10m]))
          / clamp_min(sum by (vendor, capability) (rate(adapter_calls_total[10m])), 0.001)
          > 0.25
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.vendor }}/{{ $labels.capability }} is failing more than 25% of calls'
      # The circuit breaker opened: the app is running degraded (chat-only, text-only or
      # queue-and-template, per AdapterRuntime.degraded_mode).
      - alert: AdapterCircuitDegraded
        expr: increase(adapter_degraded_total[10m]) > 0
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.vendor }}/{{ $labels.capability }} circuit opened; app is degraded'

  - name: availability
    rules:
      - alert: AppDown
        expr: up{job=~"apps|workers"} == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: '{{ $labels.job }} target {{ $labels.instance }} has been down for 5m'
