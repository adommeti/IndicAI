# Spoken pace per language, for the UC2 timing-fit estimate (PRD D10).
#
# `chars_per_second` is the rate at which Bulbul covers characters of the target
# script at pace=1.0. Indic scripts pack more phonemes per character than Latin,
# so the rate differs by script; one number for all languages mis-estimates
# Telugu and Tamil in opposite directions.
#
# PROVENANCE: measured, not guessed. Derived from the three narration samples
# rendered during uc2/P0-spike (`docs/adr/assets/0003/bulbul-*.mp3`, speaker
# shreya, bulbul:v3, pace=1.0, 24 kHz) by parsing MP3 frame headers for the true
# duration and dividing the known character count by it:
#
#   hi-IN  400 chars / 30.1 s = 13.3
#   te-IN  372 chars / 30.2 s = 12.3
#   ta-IN  450 chars / 32.2 s = 14.0
#
# CAVEAT: one voice, one pace, one sample per language, on compliance-register
# prose. Good enough to make the timing check discriminate; `uc2/P4` measures
# per-segment durations on real dubbed output and should widen this base.
# The earlier hand-guessed values (11.5 / 10.0 / 10.5) were 13.5% / 18.7% / 25%
# below the measured rates, and made every correct translation look like a
# timing failure.
#
# CIRCULARITY, read this before quoting a baseline timing number: the golden
# segment durations in platform/eval/golden/uc2_training/samples/ were authored
# at the `en-IN` rate below, so for an *untranslated* baseline the length ratio
# is the constant en_cps / lang_cps for every segment in a language. The runner
# detects that (`timing_durations_synthetic`) and says so on its stage line.
# The check discriminates normally on real translations, whose lengths vary.

measured: true
measured_from: docs/adr/assets/0003/bulbul-*.mp3 (uc2/P0-spike, bulbul:v3, speaker shreya, pace 1.0)
tolerance: 0.15 # +/- 15% of the segment duration counts as fitting (D10)

# `words_per_second` is the ENGLISH word budget the `adapt` stage works to
# (uc2/P2). adapt rewrites English, but what has to fit the segment is the
# *translation*, so the budget is how many English words survive rendering into
# that language within a second of speech. Derived per language from the 90
# golden reference translations: median target characters per English source
# word, divided by that language's chars_per_second above.
#
#   hi-IN  6.89 chars/word / 13.3 = 0.518 s/word -> 1.93 words/s
#   te-IN  6.28 chars/word / 12.3 = 0.510 s/word -> 1.96 words/s
#   ta-IN  7.57 chars/word / 14.0 = 0.541 s/word -> 1.85 words/s
#
# Reproduce with `platform/eval/runners/run_uc2.py --words-per-second`. This is
# why adapt has to compress: the golden scripts were authored at 15 English
# chars/s, about 2.5 words/s, so roughly a quarter of the words must go.
# The expansion ratio comes from DRAFT references, so it inherits their caveat;
# uc2/P4 should re-derive it from approved text and from dubbed durations.

languages:
  en-IN:
    chars_per_second: 15.0
    measured: false
    note: source pace, used only to sanity-check the authored sample timings
  hi-IN:
    chars_per_second: 13.3
    words_per_second: 1.93
    chars_per_source_word: 6.89
    script: Devanagari
  te-IN:
    chars_per_second: 12.3
    words_per_second: 1.96
    chars_per_source_word: 6.28
    script: Telugu
  ta-IN:
    chars_per_second: 14.0
    words_per_second: 1.85
    chars_per_source_word: 7.57
    script: Tamil
