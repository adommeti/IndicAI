[project]
name = "indic-ai-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["indic-platform", "helpdesk-agent", "training-localizer", "comms-surveillance"]

[tool.uv.workspace]
members = ["platform", "apps/*"]

[tool.uv.sources]
indic-platform = { workspace = true }
helpdesk-agent = { workspace = true }
training-localizer = { workspace = true }
comms-surveillance = { workspace = true }

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "pytest-asyncio", "pre-commit", "pip-audit", "detect-secrets", "types-PyYAML"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["platform/tests"]
asyncio_mode = "auto"
markers = [
  "slow: live vendor calls; requires LIVE_API_TESTS=1",
  "integration: needs the local Docker stack (postgres, redis, qdrant, minio, tei)",
  "ticketing: needs the `ticketing` compose profile (Zammad); not provisioned in CI",
  # `voice` is deliberately NOT `integration`. CI provisions postgres/redis/qdrant but no
  # LiveKit, and the integration job fails on ANY skip (uc3/P5's evidence guard), so a
  # LiveKit-dependent test carrying `integration` would turn CI red for a service that was
  # never going to be there. `make voice-test` is this marker's runner, and it must be
  # deselected everywhere `integration` and `ticketing` are.
  "voice: needs a running LiveKit room (`make stack-voice`); not provisioned in CI",
]
