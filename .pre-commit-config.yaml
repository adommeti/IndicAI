repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: uv.lock
  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit locked environment
        # Ignored findings are justified one by one in docs/security/audit-exceptions.md,
        # each with the reachability argument that makes it an exception rather than a
        # silencing. Adding an id here without an entry there is not allowed. Keep this
        # list in step with scripts/checks.sh and .github/workflows/ci.yml: the three run
        # the same audit, so an ignore in one and not the others is a hook that fails on
        # an accepted finding.
        entry: uv run pip-audit --skip-editable --ignore-vuln PYSEC-2026-3740
        language: system
        pass_filenames: false
        files: (^uv.lock$|pyproject.toml$)
