# UC2 terminology glossary — governs post_edit (PRD D7) and the eval runner's adherence check.
#
# Two kinds of entry:
#   keep_english      — the term stays in Latin script, verbatim, in every language.
#   approved_renderings — the term must appear exactly as given for that language.
#
# STATUS. Every approved rendering below is `status: draft`: authored here so the
# pipeline and the eval harness can be wired and measured, NOT confirmed by a
# bilingual reviewer. A reviewer replaces the string and flips `status: approved`;
# nothing else about the entry changes. The runner counts draft renderings for
# adherence (the check is exact-match either way) but reports terminology as
# `provisional` while any entry is draft, so a green run cannot be mistaken for
# a reviewed one.
#
# Versioned in git; every localization row records `glossary_version` in meta (D6).

version: 1
status: draft
languages: [hi-IN, te-IN, ta-IN]

# ---------------------------------------------------------------------------
# keep_english: 25 entries. Security and product nouns that Indian employees
# already use in English, plus vendor names. Translating these loses the term
# of art and makes the audio harder to follow, not easier.
# ---------------------------------------------------------------------------
keep_english:
  - term: MFA
    note: also spoken as "multi-factor authentication"; keep the initialism
  - term: VPN
  - term: DLP
  - term: phishing
  - term: vishing
  - term: smishing
  - term: malware
  - term: ransomware
  - term: firewall
  - term: password
  - term: passphrase
  - term: OTP
  - term: SSO
  - term: helpdesk
  - term: laptop
  - term: server
  - term: email
  - term: login
  - term: logout
  - term: Microsoft 365
    note: product name
  - term: Outlook
    note: product name
  - term: Teams
    note: product name
  - term: SharePoint
    note: product name
  - term: Zscaler
    note: product name
  - term: GMO
    note: company name; never transliterated

