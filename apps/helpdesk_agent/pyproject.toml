[project]
name = "helpdesk-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["indic-platform", "fastapi"]
[tool.uv.sources]
indic-platform = { workspace = true }
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["helpdesk_agent"]
package-dir = { helpdesk_agent = "." }
