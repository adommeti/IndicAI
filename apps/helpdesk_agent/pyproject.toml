[project]
name = "helpdesk-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "indic-platform",
    "fastapi",
    "langgraph",
    "langid",
    "sqlalchemy[asyncio]",
    "pipecat-ai[silero]>=0.0.60",
    "livekit>=1.1.18",
    "livekit-api>=1.2.1",
]
[tool.uv.sources]
indic-platform = { workspace = true }
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["helpdesk_agent"]
package-dir = { helpdesk_agent = "." }
[tool.setuptools.package-data]
helpdesk_agent = ["sample_kb/*.md", "prompts/*.md"]
