# DRAFT -- owned by Compliance, not by engineering.
#
# Changes go through a pull request with Compliance approval (PRD E7). CI runs
# the UC3 eval on every change to this directory and blocks on regression, so a
# term added here is a measured change, not a silent one.
#
# `terms` are matched literally, token-aware, case-insensitively, against both
# the native-script transcript and its Roman rendering. `regex` is for shapes a
# word list cannot express. `weight` feeds the Stage 0 score; `severity` is what
# a reviewer sees. Nothing here decides anything on its own -- Stage 0 is a
# recall floor and a triage input (E5).
category: guaranteed_returns
status: draft
owner: compliance
description: >
  Promising a client a certain, assured or risk-free return, or denying the
  possibility of loss. The regulatory line is the promise, not the number.
entries:
  - id: gr-001
    note: explicit guarantee attached to a return
    negatable: true
    severity: high
    weight: 0.9
    terms:
      - guaranteed return
      - guaranteed returns
      - return is guaranteed
      - returns are guaranteed
      - गारंटीड रिटर्न
      - रिटर्न की गारंटी
      - रिटर्न गारंटी
      - రాబడి గ్యారంటీ
      - గ్యారంటీ రాబడి
      - வருமானம் உறுதி
      - உறுதியான வருமானம்
      - return guaranteed hai
      - guaranteed return milega
      - return ki guarantee
    # The standard risk disclaimer uses the same words as the promise, so this
    # entry is negation-aware: see `negatable` in matcher.py.
    negatable: true
    regex: '\bguarantee\w*\s+(?:\w+\s+){0,2}returns?\b'

  - id: gr-002
    note: assured or certain return, without the word guarantee
    negatable: true
    severity: high
    weight: 0.85
    terms:
      - assured return
      - assured returns
      - certain return
      - sure return
      - fixed return
      - निश्चित रिटर्न
      - रिटर्न निश्चित है
      - पक्का रिटर्न
      - ఖాయమైన రాబడి
      - రాబడి ఖాయం
      - உறுதி வருமானம்
      - return fixed hai
      - return pakka hai
      - assured return milega

  - id: gr-003
    note: capital protection or no-loss claims
    severity: high
    weight: 0.85
    terms:
      - capital protected
      - capital protection
      - capital is safe
      - principal is safe
      - no downside
      - no loss
      - cannot lose
      - zero risk
      - risk free
      - पूँजी सुरक्षित
      - पूंजी पूरी तरह सुरक्षित
      - कोई नुकसान नहीं
      - नुकसान का सवाल ही नहीं
      - मूलधन सुरक्षित
      - మూలధనం సురక్షితం
      - నష్టం ఉండదు
      - నష్టం అనేది ఉండదు
      - முதலீடு பாதுகாப்பானது
      - நஷ்டமே இல்லை
      - capital protected hai
      - koi downside nahi
      - nuksan nahi hoga

  - id: gr-004
    note: a specific promised percentage
    severity: high
    weight: 0.8
    terms:
      - twelve percent guaranteed
      - guaranteed twelve percent
      - बारह प्रतिशत की गारंटी
      - पन्द्रह प्रतिशत की गारंटी
      - పన్నెండు శాతం గ్యారంటీ
      - பன்னிரண்டு சதவீதம் உறுதி
      - bara percent guaranteed
    regex: '\b\d{1,2}\s*(?:%|percent|per\s*cent|प्रतिशत|శాతం|சதவீதம்)\s*(?:\w+\s+){0,3}(?:guarantee|guaranteed|assured|pakka|fixed)\b'

  - id: gr-005
