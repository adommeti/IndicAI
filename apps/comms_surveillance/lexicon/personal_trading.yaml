    note: a trade verb close to a personal-account marker
    severity: high
    weight: 0.8
    terms: []
    regex: '\b(?:bought|buy|sold|sell|took\s+a\s+position)\b[^.!?]{0,60}\b(?:my|personal|own)\s+(?:account|demat|portfolio)\b'

