  - id: pt-024
    note: personal-account marker close to a trade verb
    severity: high
    weight: 0.8
    terms: []
    regex: '\b(?:my|personal|own|wife|husband|brother|father)\b[^.!?]{0,30}\b(?:account|demat|portfolio)\b[^.!?]{0,60}\b(?:bought|buy|sold|sell|took|position)\b'

