category: personal_trading
status: draft
owner: compliance
description: >
  Dealing for one's own account, or a connected account, in a way the personal
  account dealing policy forbids: ahead of a client order, without
  pre-clearance, or hidden from the log.
entries:
  - id: pt-001
    note: dealing ahead of a client order
    severity: high
    weight: 0.9
    terms:
      - before we placed the client order
      - ahead of the client order
      - front run
      - front running
      - क्लाइंट ऑर्डर से पहले
      - ग्राहक के ऑर्डर से पहले
      - క్లయింట్ ఆర్డర్ కంటే ముందే
      - வாடிக்கையாளர் ஆர்டருக்கு முன்பே
      - client order se pehle

